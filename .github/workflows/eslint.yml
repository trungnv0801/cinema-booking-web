name: ESLint Check

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Check API schema drift
        env:
          OPENAPI_URL: ${{ vars.OPENAPI_URL }}
        run: npm run check:api

      - name: Build project
        run: npm run build
